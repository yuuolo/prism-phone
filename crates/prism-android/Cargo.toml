[package]
name = "prism-android"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
acceptance-tools = []

[[bin]]
name = "prism-acceptance-client"
path = "tests/tools/acceptance_client.rs"
required-features = ["acceptance-tools"]

[dependencies]
prism-core = { path = "../prism-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ipnet = "2"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
async-trait = "0.1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "bindgen"] }
jni = "=0.21.1"
libc = "0.2"
