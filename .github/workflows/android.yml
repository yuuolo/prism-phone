name: Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'crates/**', 'scripts/android/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'crates/**', 'scripts/android/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          cache-on-failure: true
      - uses: gradle/actions/setup-gradle@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Native compiler identity
        id: compiler
        run: echo "identity=$(rustc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: native
        with:
          path: android/app/src/main/jniLibs/
          key: android-jni-ndk28-api26-${{ steps.compiler.outputs.identity }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/prism-core/**', 'crates/prism-android/**', 'scripts/android/build-native.sh') }}
      - name: Native build tooling
        run: cargo install cargo-ndk --version 4.0.0 --locked
      - name: Shared mobile policy tests
        run: |
          cargo test -p prism-android --lib --locked
          cargo test -p prism-core --lib --test anytls_wire --test relay_tls_wire --test dns_fallback --test mobile_traffic --test dns_privacy_routing --test fake_ip_rules --test network_recovery --locked
      - name: Build Android native libraries
        if: steps.native.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash scripts/android/build-native.sh
      - name: Build APK and instrumentation
        run: |
          bash android/gradlew -p android testDebugUnitTest assembleDebug --stacktrace
          bash scripts/android/build-update-fixtures.sh
          bash android/gradlew -p android assembleDebugAndroidTest assembleRelease lintDebug lintRelease --stacktrace
      - name: Build independent background acceptance tools
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export RUSTFLAGS='-C link-arg=-Wl,-z,max-page-size=16384'
          cargo ndk -t x86_64 --platform 26 build --release -p prism-android --features acceptance-tools --bin prism-acceptance-client --locked
          mkdir -p background-tools
          cp target/x86_64-linux-android/release/prism-acceptance-client background-tools/
          bash android/gradlew -p android assembleDebugAndroidTest -PprismAcceptanceRunner=dev.prism.android.BackgroundSeedInstrumentation
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk background-tools/seed.apk
          bash android/gradlew -p android assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: prism-android-background-tools
          path: background-tools/
      - name: Release has no network-switch test permissions
        run: |
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump permissions android/app/build/outputs/apk/release/app-release-unsigned.apk > release-permissions.txt
          grep -Fxq 'package: dev.prism.android' release-permissions.txt
          if grep -Eq 'android.permission.(CHANGE_WIFI_STATE|ACCESS_WIFI_STATE)' release-permissions.txt; then
            cat release-permissions.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: prism-android-unsigned-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-android-alpha
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.html
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: '37.0'
            image: '37.2'
            target: google_apis_ps16k
            label: android17-16k
            avd: PrismPhoneCI
          - api: '26'
            image: '26'
            target: google_apis
            label: android8
            avd: PrismPhoneApi26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: prism-android-alpha
          path: apk
      - name: Isolate emulator SDK
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/prism-android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/prism-android-sdk" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: prism-android-background-tools
          path: background-tools
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.image }}
          arch: x86_64
          target: ${{ matrix.target }}
          avd-name: ${{ matrix.avd }}
          disable-animations: true
          script: bash scripts/android/test-emulator.sh apk ${{ matrix.avd }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-results-${{ matrix.label }}
          path: emulator-results/
